# ---- 抗 DDoS / 暴力扫描：按来源 IP 限速与限连 ----
# limit_req_zone / limit_conn_zone 只能声明在 http 上下文；本文件被 conf.d 引入
# 时已在 http 内，所以放在 server 之前即可。
# API 与静态资源分开限速：一次页面加载会并发拉十几个静态文件，阈值要放宽些；
# API 侧收紧到 20 次/秒，正常使用远远够用。app 层（app/defense.py）还有一层
# 更严格的突发/持续双窗口限速与自动封禁，这里只是第一道闸。
# 每 1MB zone 约能记 8k 个来源，4m 足够单机面板；小内存服务器不为此多占几十 MB。
limit_req_zone $binary_remote_addr zone=foxops_api:4m rate=20r/s;
limit_req_zone $binary_remote_addr zone=foxops_static:4m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=foxops_conn:4m;

server {
    listen __FOXOPS_PUBLIC_PORT__;
    listen [::]:__FOXOPS_PUBLIC_PORT__;
    server_name __FOXOPS_SERVER_NAME__;

    # ---- 隐藏 Nginx 版本号 ----
    # 关闭后，错误页与响应头 Server 不再携带版本信息，减小信息泄露面。
    server_tokens off;

    access_log /var/log/nginx/foxops_access.log;
    error_log /var/log/nginx/foxops_error.log warn;

    # ---- 连接级限流与慢速攻击防护 ----
    # 单 IP 并发连接数封顶，配合下面的读写超时，挡住 slowloris 这类"占着连接
    # 不发数据"的攻击；超限返回 429/503，由自定义错误页接管。
    limit_conn foxops_conn 32;
    limit_conn_status 503;
    limit_req zone=foxops_static burst=100 nodelay;
    limit_req_status 429;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # ---- 静态资源压缩（Gzip）----
    # 反向代理层对文本类响应启用压缩，减少 JS/CSS/HTML/SVG/JSON 体积。
    # 已压缩格式（woff2/png 等）不在名单内，避免无谓的二次压缩。
    gzip on;
    gzip_vary on;               # 响应头带 Vary: Accept-Encoding，避免中间代理缓存错乱
    gzip_comp_level 5;          # 压缩比与 CPU 开销的平衡点
    gzip_min_length 1024;       # 小于 1KB 不压（收益低、开销高）
    gzip_http_version 1.1;      # 只对 HTTP/1.1+ 客户端压缩
    gzip_proxied any;           # 对经 proxy_pass 转发的响应也压缩
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- 自定义错误页 ----
    # 404：未知路径返回自定义页；500/502/503/504：后端异常或不可达时返回。
    # 页面为自包含 HTML（内联样式），即使主 CSS/JS 加载失败也能正常展示。
    error_page 404 /404.html;
    error_page 429 /429.html;
    error_page 500 502 503 504 /500.html;

    location = /404.html {
        root /opt/foxops/app/static;
        internal;
    }

    location = /429.html {
        root /opt/foxops/app/static;
        internal;
    }

    location = /500.html {
        root /opt/foxops/app/static;
        internal;
    }

    location /api/ {
        # API 单独限速：每个来源 20 次/秒，允许 40 个突发（面板一次刷新并发
        # 请求 summary + metrics，远低于阈值）。超限直接 429，不进后端。
        limit_req zone=foxops_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /vendor/ {
        root /opt/foxops/app/static;
        expires 30d;
    }

    # ---- 图标：文件名固定、内容随版本变 ----
    # 浏览器对 favicon 的启发式缓存相当顽固，不声明 Cache-Control 就会在换图标后
    # 长期显示旧图。这里与 app/main.py 的 no-cache 保持一致，强制回源校验。
    location = /favicon.ico {
        root /opt/foxops/app/static;
        expires -1;
    }

    location = /icons/favicon.svg {
        root /opt/foxops/app/static;
        expires -1;
    }

    location = /index.html {
        root /opt/foxops/app/static;
        expires -1;
    }

    # 这些文件不改名、内容会变，必须回源校验（expires -1 即 no-cache）：否则升级后
    # 浏览器会拿启发式缓存的旧 JS/CSS，修复直接失效（登录页曾因此继续跑老逻辑）。
    location ~ ^/(app\.js|render\.js|style\.css|login\.html|login\.css|login\.js|theme\.js|session\.js)$ {
        root /opt/foxops/app/static;
        expires -1;
    }

    location / {
        root /opt/foxops/app/static;
        # 未匹配的静态路径返回真实 404，由自定义 /404.html 接管；
        # 首页 / 与已知资源仍正常命中。
        try_files $uri $uri/ =404;
    }
}
