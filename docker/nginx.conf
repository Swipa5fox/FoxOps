# FoxOps 容器内反向代理：安全头与 CSP 与 deploy/foxops.nginx.conf 保持一致，
# 只把 upstream 换成了 compose 服务名 app:8000。

# ---- 抗 DDoS / 暴力扫描：与原生部署同一套限速策略 ----
# 容器里静态资源也走 proxy_pass，所以只用一个 zone；30 次/秒足够一次页面加载
# 的十几个并发请求，单 IP 持续刷量则会被 429 挡住。
limit_req_zone $binary_remote_addr zone=foxops_http:4m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=foxops_conn:4m;

server {
    listen 8080;
    server_name _;

    # ---- 隐藏 Nginx 版本号 ----
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # ---- 连接级限流与慢速攻击防护 ----
    limit_conn foxops_conn 32;
    limit_conn_status 503;
    limit_req zone=foxops_http burst=80 nodelay;
    limit_req_status 429;
    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # ---- 静态资源压缩（Gzip）----
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_http_version 1.1;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- 自定义错误页（compose 把 app/static 只读挂到 foxops-static）----
    error_page 404 /404.html;
    error_page 429 /429.html;
    error_page 500 502 503 504 /500.html;

    location = /404.html {
        root /usr/share/nginx/foxops-static;
        internal;
    }

    location = /429.html {
        root /usr/share/nginx/foxops-static;
        internal;
    }

    location = /500.html {
        root /usr/share/nginx/foxops-static;
        internal;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
