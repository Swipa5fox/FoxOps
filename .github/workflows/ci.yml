# FoxOps 最小 CI
#
# 目的：把"靠人记得跑测试"变成"机器强制跑"。每次 push / PR 自动执行：
#   1. Python 编译 + 冒烟/API/前端安全测试
#   2. 前端渲染构建 + 语法检查 + CSP 底线（禁止 eval / new Function）
#   3. shellcheck 全量部署脚本
#   4. 部署脚本夹具测试（平台识别 / 安装辅助函数 / Nginx 模板）
#   5. 发布包构建 + SHA-256 输出
#   6. Docker 镜像构建 + 容器内 /api/health 冒烟
#
# 拦截目标：类似 load_15 取错数组索引、clampPercent 缺参导致白屏这类回归，
# 在合并前就被拦下，而不是等上线后才发现。
#
# 扩展建议（当前不做，保持最小）：
#   - 多版本 Python 矩阵（3.9 / 3.11 / 3.13）
#   - 覆盖率门禁、pip-audit 依赖审计
#   - 自动发布到 GitHub Releases

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支新提交取消旧运行，节省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: 测试与检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装系统依赖（shellcheck + nginx）
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck nginx

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 安装前端构建依赖
        run: npm ci --prefix tools

      - name: Python 编译检查
        run: python -m compileall -q app tests

      - name: Python 冒烟测试（smoke / API / 防护 / 前端安全）
        run: |
          python tests/smoke.py
          python tests/api_smoke.py
          python tests/defense_smoke.py
          python tests/frontend_smoke.py

      - name: 前端渲染构建与语法检查
        run: |
          npm run render --prefix tools
          # 生成物已入仓：若与 index.html 不同步则阻断，避免线上跑旧模板
          git diff --exit-code app/static/render.js
          node --check app/static/render.js
          node --check app/static/app.js
          node --check app/static/session.js
          node --check app/static/login.js
          node --check app/static/theme.js
          # CSP 底线：render.js 不得出现 eval / new Function
          ! grep -qE "new Function|eval\(" app/static/render.js

      - name: shellcheck 部署与测试脚本
        run: |
          shellcheck \
            deploy/preflight.sh \
            deploy/install.sh \
            deploy/verify-server.sh \
            deploy/foxopsctl \
            deploy/lib/config.sh \
            deploy/lib/platform.sh \
            tests/install_helpers.sh \
            tests/platform_detection.sh \
            tests/nginx_template.sh

      - name: 构建发布包并输出 SHA-256
        run: |
          python tools/build-release.py --output releases/foxops.tar.gz
          echo "--- 发布包 SHA-256 ---"
          sha256sum releases/foxops.tar.gz

  docker:
    name: Docker 镜像构建与冒烟
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 校验 docker-compose.yml
        run: docker compose config -q

      - name: 构建镜像
        run: docker build -f docker/Dockerfile -t foxops:ci .

      - name: 容器内 /api/health 冒烟
        run: |
          set -Eeuo pipefail
          docker run -d --name foxops-ci -p 18000:8000 foxops:ci
          # 数据目录写在容器可写层，不依赖命名卷；最多等 30s
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:18000/api/health 2>/dev/null); then
              echo "health: $body"
              if printf '%s' "$body" | grep -q '"status":"ok"'; then
                exit 0
              fi
            fi
            sleep 1
          done
          echo "health check failed; container logs:" >&2
          docker logs foxops-ci >&2 || true
          exit 1

      - name: 清理容器
        if: always()
        run: docker rm -f foxops-ci || true

  fixture:
    name: 夹具测试 / ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - install_helpers
          - platform_detection
          - nginx_template

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装夹具依赖
        run: |
          if [ "${{ matrix.fixture }}" = "nginx_template" ]; then
            sudo apt-get update
            sudo apt-get install -y nginx
          elif [ "${{ matrix.fixture }}" = "install_helpers" ]; then
            sudo apt-get update
            sudo apt-get install -y sudo
          fi

      - name: 运行 ${{ matrix.fixture }}
        run: bash "tests/${{ matrix.fixture }}.sh"
